[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cu-migrate"
version = "0.1.0"
description = "Offline Azure Content Understanding Preview-to-GA schema migration planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cu-migrate = "cu_migrate.cli:main"

[tool.setuptools.packages.find]
include = ["cu_migrate*"]
