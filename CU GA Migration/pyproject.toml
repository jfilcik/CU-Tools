[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cu-migrate"
version = "0.1.0"
description = "Azure Content Understanding Preview-to-GA migration assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "azure-identity>=1.15",
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
cu-migrate = "cu_migrate.cli:main"

[tool.setuptools.packages.find]
include = ["cu_migrate*"]
